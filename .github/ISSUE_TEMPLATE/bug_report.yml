name: Bug 报告 / Bug report
description: 报告可复现的问题。请先搜索现有 Issue，并移除任何真实卡片数据。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **请勿**在 Issue 中粘贴真实卡号、完整卡面截图、`.mycard` 备份文件、备份密码或设备密钥。

        **Do not** paste real card numbers, full card photos, `.mycard` backups, backup passwords or device keys.
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 例如 1.2.1 (versionCode 6)。自行构建时请注明提交号或日期。
      placeholder: "1.2.1 (versionCode 6)"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: 构建类型 / Build type
      description: 从源码自行构建的包请选择对应类型。
      options:
        - Debug（自行构建 / self-built）
        - Release（自行签名 / self-signed）
        - 其他 / Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统 / Device and OS
      description: 例如 Redmi K70 / HyperOS，或 Android Studio 模拟器型号。不要包含设备序列号。
      placeholder: "Pixel 8 / Android 15；或 Android Studio emulator"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 越具体越好；可使用“卡片 A / 卡片 B”代替真实银行与尾号。
      placeholder: |
        1. 打开首页，选择“翻页卡册”
        2. 添加一张模板卡片
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 / Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behaviour
      description: 如有崩溃，请附上脱敏后的 `adb logcat` 片段。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 截图（请遮挡卡号与姓名）、系统字体缩放、是否开启动画、是否启用隐私锁等。
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已搜索现有 Issue，且内容中不包含真实卡片数据、备份文件或密码。
          required: true
        - label: 我理解这是个人维护项目，不承诺固定响应时间。
          required: false
