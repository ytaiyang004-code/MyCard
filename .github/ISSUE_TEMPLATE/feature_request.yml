name: 功能建议 / Feature request
description: 提出与本项目范围一致的建议（离线、无联网、不涉及支付）。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目刻意保持离线与最小权限：不接受联网、支付、NFC、云同步、账户体系或第三方分析 SDK。
        请勿在建议中附带真实卡片数据或第三方未授权素材。

        This project stays offline and permission-minimal: no network, payments, NFC, cloud sync, accounts or analytics SDKs.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 描述当前使用中的具体不便，而不是直接给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 可以包含界面草图或文案；请说明是否影响现有卡片数据或备份格式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Affected area
      options:
        - 首页与排布 / Home and layouts
        - 卡面模板与图片 / Card face and images
        - 详情、排序与搜索 / Detail, sorting, search
        - 设置、主题与隐私锁 / Settings, theme, privacy lock
        - 备份与恢复 / Backup and restore
        - 构建、测试与文档 / Build, tests, docs
        - 其他 / Other
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Checklist
      options:
        - label: 该建议不需要联网、账户、支付/银行连接或新增敏感权限。
          required: true
        - label: 我未在内容中包含真实卡片数据或未获授权的品牌素材。
          required: true
        - label: 我理解是否实现由维护者决定，且不承诺时间表。
          required: false
